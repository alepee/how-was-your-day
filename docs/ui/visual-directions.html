<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--foreground,#20232a);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #588aff;outline-offset:3px}button{color:inherit} .explore{padding:8px 0 24px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted-foreground,#727781)}.directions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.direction{border:1px solid var(--border,#ddd);background:var(--card,#fff);text-align:left;border-radius:12px;padding:15px;display:grid;gap:7px}.direction[aria-pressed=true]{border-color:var(--foreground,#222);box-shadow:inset 0 0 0 1px var(--foreground,#222)}.direction strong{font-size:16px;font-weight:600}.direction small{font-size:12px;color:var(--muted-foreground,#666);line-height:1.4}.swatches{display:flex;gap:4px}.swatches i{height:8px;width:22px;border-radius:3px}.description{display:flex;gap:16px;align-items:center;justify-content:space-between;margin:18px 0;color:var(--muted-foreground,#666);font-size:13px;line-height:1.5}.recommended{white-space:nowrap;font-size:11px;border:1px solid var(--border,#ddd);padding:5px 9px;border-radius:20px}.scenes{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px}.scenes button{padding:8px 13px;border:0;background:transparent;border-radius:7px;font-size:12px}.scenes button[aria-pressed=true]{background:var(--primary,#222);color:var(--primary-foreground,#fff)}
.stage{padding:22px;background:light-dark(#e8eaf0,#242733);border-radius:16px;min-height:625px;color-scheme:light}.window{--paper:#fff;--surface:#f5f5f7;--line:#e6e7eb;--ink:#23262d;--muted:#747984;--accent:#4469d4;--soft:#edf1ff;--rec:#c64f55;color:var(--ink);background:var(--paper);border:1px solid #ffffff55;border-radius:12px;box-shadow:0 20px 42px #151d3220;overflow:hidden;min-height:575px;font-size:13px}.chrome{height:47px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.traffic{display:flex;gap:7px;align-items:center}.traffic i{width:10px;height:10px;background:#ff6057;border-radius:50%}.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}.chrome-brand{color:var(--ink);font-weight:600;letter-spacing:.3px}.local{display:flex;align-items:center;gap:5px}.local:before{content:'';height:5px;width:5px;background:#589b7b;border-radius:50%}.shell{display:grid;grid-template-columns:150px 1fr;min-height:528px}.sidebar{padding:20px 12px;background:var(--surface);border-right:1px solid var(--line)}.brandmark{padding:0 8px 24px;font-size:19px;letter-spacing:-1px;font-weight:650}.brandmark span{color:var(--accent)}.navitem{display:block;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:9px 10px;margin:3px 0;font-size:12px}.navitem.active{background:var(--soft);color:var(--accent);font-weight:600}.side-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:25px 10px 9px}.sidebar-foot{margin:65px 8px 0;font-size:11px;color:var(--muted);line-height:1.6}.main{padding:29px 27px;min-width:0}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.overline{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:25px;line-height:1.2;letter-spacing:-.8px;font-weight:600;margin:9px 0}h2{font-size:17px;font-weight:600}h3{font-size:12px;font-weight:600}.subtle{color:var(--muted);font-size:12px;line-height:1.6}.primary{background:var(--accent);color:#fff;border:0;padding:10px 13px;border-radius:7px;font-size:12px;white-space:nowrap}.primary.record:before{content:'●';font-size:10px;margin-right:7px}.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:8px 11px;border-radius:6px;font-size:12px}.divider{height:1px;background:var(--line);margin:23px 0}.listlabel{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);letter-spacing:.8px;margin:28px 0 8px;text-transform:uppercase}.session{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:17px 0;background:none;display:flex;gap:13px;align-items:center}.session:hover{background:var(--surface)}.session-icon{width:32px;height:36px;display:grid;place-items:center;background:var(--surface);border-radius:8px;color:var(--accent);font-size:16px;flex-shrink:0}.session-content{flex:1;min-width:0}.session-title{font-size:13px;font-weight:550;margin-bottom:5px}.session-meta{font-size:11px;color:var(--muted)}.session-time{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}.dotsep{margin:0 5px;opacity:.5}.footnote{font-size:11px;color:var(--muted);margin-top:25px;line-height:1.6}.daily-note{background:var(--surface);padding:16px;margin:21px 0;border-radius:8px;line-height:1.65;font-size:13px}.tag{font-size:10px;padding:4px 7px;border-radius:5px;background:var(--soft);color:var(--accent);display:inline-block}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:24px 0 20px}.tabs button{border:0;background:none;padding:0 0 10px;font-size:12px;color:var(--muted)}.tabs button.active{color:var(--accent);border-bottom:2px solid var(--accent)}.player{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;align-items:center;gap:12px;margin-top:22px}.play{background:var(--accent);color:#fff;border:0;width:31px;height:31px;border-radius:50%;flex-shrink:0;font-size:11px}.wave{display:flex;align-items:center;gap:2px;height:35px;flex:1;overflow:hidden}.wave i{background:var(--accent);opacity:.35;flex:1;min-width:2px;border-radius:2px}.wave i:nth-child(-n+12){opacity:1}.time{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.turn{display:grid;grid-template-columns:43px 1fr;gap:9px;padding:11px 0;font-size:13px;line-height:1.6}.turn time{font-size:10px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}.speaker{font-size:11px;color:var(--accent);display:block;margin-bottom:3px}.speaker-select{font-size:11px;border:1px dashed var(--accent);color:var(--accent);background:var(--soft);border-radius:4px;padding:3px 5px;margin-bottom:5px;max-width:100%}.summary-text{line-height:1.7;font-size:13px}.summary-text h3{margin:20px 0 8px;color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:1px}.summary-text ul{padding-left:18px;margin:6px 0}.editor{width:100%;min-height:180px;border:0;resize:vertical;line-height:1.8;background:transparent;color:var(--ink);padding:10px 0;font-size:13px}.capture-layout{display:grid;grid-template-columns:1fr;gap:15px}.livebar{display:flex;align-items:center;gap:8px;color:var(--rec);font-size:11px}.reddot{height:7px;width:7px;background:var(--rec);border-radius:50%}.timer{font-size:43px;letter-spacing:-2px;font-weight:350;font-variant-numeric:tabular-nums;margin:18px 0 15px}.capture-sources{display:flex;gap:10px;flex-wrap:wrap}.source{flex:1;background:var(--surface);padding:12px;border-radius:7px;min-width:120px}.source .wave{height:24px;margin-top:8px}.source .wave i{background:#679980}.source-name{font-size:11px;color:var(--muted)}.notepad{border-top:1px solid var(--line);margin-top:25px;padding-top:18px}.notepad .editor{min-height:130px}.stop{background:var(--ink);color:var(--paper);padding:9px 14px;border:0;border-radius:7px;font-size:12px}.capture-footer{display:flex;align-items:center;justify-content:space-between;gap:10px}.saved{color:var(--muted);font-size:10px}.menu-scene{position:relative}.mac-menubar{background:var(--surface);padding:8px 12px;display:flex;justify-content:flex-end;font-size:11px;gap:16px;border-bottom:1px solid var(--line)}.menuchip{background:var(--soft);color:var(--accent);padding:3px 8px;border-radius:5px}.small-caption{font-size:10px;color:var(--muted)}
.window.carnet{--paper:#faf7ef;--surface:#f0eadf;--line:#ded8ca;--ink:#353d32;--muted:#7c8070;--accent:#607751;--soft:#e5eadb;border-radius:6px}.carnet .chrome{border-bottom:0}.carnet .shell{display:block}.carnet .sidebar{display:none}.carnet .main{padding:27px 37px}.carnet h1{font-family:Georgia,serif;font-size:33px;font-weight:400;letter-spacing:-1px}.carnet .session-icon{display:none}.carnet .session{padding:19px 0}.carnet .session-title{font-family:Georgia,serif;font-size:17px}.carnet .daily-note{border-left:2px solid var(--accent);border-radius:0;background:transparent;padding:0 0 0 15px;font-family:Georgia,serif;font-style:italic;font-size:17px;line-height:1.5;margin:25px 0}.carnet .primary,.carnet .ghost{border-radius:4px}.carnet .editor{background:repeating-linear-gradient(transparent,transparent 28px,var(--line) 29px,transparent 30px);line-height:30px;font-family:Georgia,serif;font-size:15px;padding-top:0}.carnet .timer{font-family:Georgia,serif;font-size:45px}.carnet .source{background:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0}.carnet .summary-text{font-family:Georgia,serif;font-size:15px}.carnet .tabs{gap:24px}.carnet .player{background:transparent;border:0;padding:0;border-radius:0}.carnet .turn{border-bottom:1px solid var(--line);padding:13px 0}.carnet .topline{align-items:flex-start}
.window.studio{--paper:#1b2025;--surface:#232a30;--line:#343d44;--ink:#e7ecee;--muted:#9aa8af;--accent:#a5dcc8;--soft:#2b403a;--rec:#eea18b;border-color:#343d44}.studio .primary{color:#172820}.studio .shell{display:block}.studio .sidebar{display:none}.studio .main{padding:23px}.studio h1{font-size:24px;letter-spacing:-.5px}.studio .chrome{background:#171c20}.studio .session{padding:15px 12px;border:1px solid var(--line);border-radius:7px;margin:8px 0}.studio .session-icon{background:#303e3d;border-radius:4px}.studio .player{border:0;padding:16px 14px;margin-top:21px}.studio .play{color:#162b24}.studio .wave{height:48px;gap:3px}.studio .timer{font-family:ui-monospace,SFMono-Regular,monospace;font-size:45px;letter-spacing:-2px}.studio .source{border:1px solid var(--line)}.studio .source .wave{height:47px}.studio .daily-note{display:flex;align-items:center;justify-content:space-between;gap:16px}.studio .tag{border:1px solid #455e55}.studio .editor{background:#171d22;border:1px solid var(--line);padding:12px;border-radius:5px}.studio .notepad{margin-top:20px}.studio .capture-footer{margin-top:10px}.studio .turn{padding:12px;background:var(--surface);margin:7px 0;border-radius:6px}.studio .tabs button.active{color:var(--accent)}.studio .stop{background:#e9a48c;color:#2e231e}.studio .session-time{color:var(--accent)}
.annotation{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px;font-size:11px;color:var(--muted-foreground,#777)}.annotation strong{font-weight:500}.prototype-status{min-height:17px}.sheet{margin-top:15px;padding:15px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.sheet label{display:block;font-size:11px;margin-bottom:8px}.sheet select{background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:7px;border-radius:5px;width:100%}
@media(max-width:620px){.stage{padding:12px;min-height:620px}.shell{grid-template-columns:1fr}.sidebar{display:none}.main,.carnet .main,.studio .main{padding:23px 20px}.directions{gap:6px}.direction{padding:11px 9px}.direction strong{font-size:14px}.direction small{font-size:11px}.description{display:block}.recommended{display:inline-block;margin-top:8px}.chrome{padding:0 13px}.chrome-brand{font-size:10px}.window{min-height:570px}.topline h1{font-size:24px}.carnet h1{font-size:29px}.local{font-size:10px}.timer{font-size:38px}.session-time{font-size:10px}.session-icon{display:none}.capture-footer{flex-wrap:wrap}.tabs{gap:14px}.stage .primary{padding:9px 10px}.description{margin:14px 0}.small-caption{display:none}}

</style></head><body>
<div class="explore" id="hwyd-explorer">
<div class="eyebrow">HWYD / Exploration d’interface</div>
<div class="directions" aria-label="Directions visuelles">
<button class="direction" data-dir="clair" aria-pressed="true"><div class="swatches"><i style="background:#e7e8ed"></i><i style="background:#fff;border:1px solid #ddd"></i><i style="background:#4469d4"></i></div><strong>Clair</strong><small>Un utilitaire macOS discret.</small></button>
<button class="direction" data-dir="carnet" aria-pressed="false"><div class="swatches"><i style="background:#efe6d4"></i><i style="background:#607751"></i><i style="background:#353d32"></i></div><strong>Carnet</strong><small>La conversation devient une page.</small></button>
<button class="direction" data-dir="studio" aria-pressed="false"><div class="swatches"><i style="background:#1b2025"></i><i style="background:#a5dcc8"></i><i style="background:#e9a48c"></i></div><strong>Studio</strong><small>Le son et les voix au premier plan.</small></button>
</div>
<div class="description"><span id="direction-desc">Hiérarchie familière, contrôles compacts, accent bleu. Une app qui s’efface pendant la conversation.</span><span class="recommended" id="recommend">Direction retenue</span></div>
<nav class="scenes" aria-label="Écran à explorer"><button data-scene="library" aria-pressed="true">Bibliothèque</button><button data-scene="capture" aria-pressed="false">En cours</button><button data-scene="review" aria-pressed="false">Relecture</button><button data-scene="menu" aria-pressed="false">Barre de menus</button></nav>
<div class="stage"><div class="window clair" id="app" aria-label="Maquette de How Was Your Day"></div></div>
<div class="annotation"><span>Prototype interactif · contenu fictif · aucun enregistrement réel</span><span id="prototype-status" class="prototype-status" aria-live="polite">Sélectionne une session pour l’explorer.</span></div>
</div>
<script>
(()=>{
const root=document.getElementById('hwyd-explorer'),app=document.getElementById('app');
let dir='studio',scene='library',tab='transcript',playing=false,speaker='Speaker 3',selectedTitle='Le prochain chapitre',notes='Simplifier le premier lancement.\n\nUne session doit pouvoir commencer sans calendrier.',captureNotes='[00:03:10] Garder le démarrage en un clic.\n[00:12:45] Revoir le parcours de correction des voix.';
const descriptions={clair:'Hiérarchie familière, contrôles compacts, accent bleu. Une app qui s’efface pendant la conversation.',carnet:'Typographie éditoriale, papier chaud, vert sauge. Les notes sont le cœur de la session, le transcript reste à portée de main.',studio:'Surfaces graphite, menthe et cuivre. Les pistes audio, les temps de parole et la correction des speakers sont immédiatement lisibles.'};
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wave=(n=48)=>'<div class="wave" aria-hidden="true">'+Array.from({length:n},(_,i)=>'<i style="height:'+ (12+((i*17+i*i*3)%82))+'%"></i>').join('')+'</div>';
const chrome=()=>'<div class="chrome"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><span class="chrome-brand">How Was Your Day</span><span class="local">Sur ce Mac</span></div>';
const sidebar=()=>'<aside class="sidebar"><div class="brandmark">hwyd<span>●</span></div><button class="navitem '+(scene==='library'?'active':'')+'" data-action="library">Toutes les sessions</button><button class="navitem" data-action="capture">Nouvelle session</button><div class="side-label">Aujourd’hui</div><button class="navitem '+(scene==='review'?'active':'')+'" data-action="review">Le prochain chapitre</button><div class="sidebar-foot">Votre voix.<br>Votre mémoire.<br>Sur votre Mac.</div></aside>';
const session=(title,meta,time,icon)=>'<button class="session" data-open="'+esc(title)+'"><span class="session-icon" aria-hidden="true">'+icon+'</span><span class="session-content"><div class="session-title">'+title+'</div><div class="session-meta">'+meta+'</div></span><span class="session-time">'+time+'</span></button>';
function library(){return '<div class="topline"><div><div class="overline">Vendredi 23 octobre</div><h1>'+(dir==='carnet'?'Ce qu’il reste de la journée.':dir==='studio'?'Vos sessions':'Votre journée')+'</h1></div><button class="primary record" data-action="capture">Enregistrer</button></div><p class="subtle">Des conversations, des idées, une trace.</p>'+(dir==='carnet'?'<div class="daily-note">« Une bonne idée commence souvent<br>par une conversation. »</div>':dir==='studio'?'<div class="daily-note"><div><span class="tag">PRÊT À CAPTURER</span><p class="subtle" style="margin-top:8px">Micro du Mac + audio système</p></div>'+wave(24)+'</div>':'')+'<div class="listlabel"><span>Aujourd’hui</span><span>3 sessions</span></div>'+session('Le prochain chapitre','Réunion · Camille, vous + 1 voix à nommer','10:00 · 32 min','◌')+session('Une idée en marchant','Mémo vocal · Vous','08:42 · 4 min','≋')+session('Café avec Léa','Conversation · Léa et vous','08:15 · 18 min','◍')+'<div class="listlabel"><span>Hier</span></div>'+session('Retour sur le prototype','Appel · Camille et vous','16:30 · 24 min','◌')+'<p class="footnote">L’audio s’efface après 72 h. Vos notes et transcripts restent.</p>';}
function capture(){return '<div class="topline"><div class="livebar"><span class="reddot"></span>Enregistrement en cours</div><span class="tag">Conversation</span></div><h1>'+(dir==='carnet'?'Une conversation à garder.':'Nouvelle session')+'</h1><p class="subtle">Sans événement calendrier</p><div class="timer">18:42<span style="font-size:13px;letter-spacing:0;color:var(--muted);margin-left:12px">enregistrées</span></div><div class="capture-sources"><div class="source"><span class="source-name">Micro du Mac</span>'+wave(32)+'</div><div class="source"><span class="source-name">Audio système</span>'+wave(32)+'</div></div><div class="notepad"><div class="topline"><h3>Notes de session</h3><button class="ghost" data-action="timestamp">+ Horodatage</button></div><textarea class="editor" id="capture-editor" aria-label="Notes pendant la capture">'+esc(captureNotes)+'</textarea></div><div class="capture-footer"><span class="saved" id="save-status">Notes conservées dans cette maquette</span><button class="stop" data-action="stop">■ Terminer la session</button></div><p class="footnote">Pensez à informer les personnes présentes. Le transcript sera prêt après la session.</p>';}
function summary(){return '<div class="summary-text"><p>Une première version centrée sur l’essentiel : commencer une session, prendre quelques notes et retrouver qui a dit quoi.</p><h3>Décision</h3><p>Le calendrier enrichit la session. Il ne doit jamais être un préalable à l’enregistrement.</p><h3>À suivre</h3><ul><li>Camille prépare deux parcours de premier lancement.</li><li>Tester la correction d’une voix sur une réunion réelle.</li></ul></div><p class="footnote">Synthèse activée pour cette session · modèle local</p>';}
function transcript(){return '<div class="turn"><time>00:12</time><div><span class="speaker">Vous · micro</span>Je veux pouvoir enregistrer une idée sans créer une réunion.</div></div><div class="turn"><time>00:21</time><div><span class="speaker">Camille · système</span>Alors on commence par un bouton, et on ajoute le contexte ensuite.</div></div><div class="turn"><time>00:38</time><div><select class="speaker-select" id="speaker-select" aria-label="Nommer cette voix"><option value="Speaker 3" '+(speaker==='Speaker 3'?'selected':'')+'>Speaker 3 · voix à nommer</option><option value="Léa" '+(speaker==='Léa'?'selected':'')+'>Léa · confirmer ce nom</option><option value="Nicolas" '+(speaker==='Nicolas'?'selected':'')+'>Nicolas · confirmer ce nom</option></select><p>Et les notes prises pendant la discussion doivent rester au même endroit.</p></div></div><p class="footnote">Nommer cette voix corrige la session. Cela ne crée pas d’empreinte vocale.</p>';}
function review(){let first=dir==='carnet'?'notes':'summary';return '<div class="topline"><div class="overline">Réunion · 23 octobre · 10:00</div><button class="ghost" data-action="library">Toutes les sessions</button></div><h1>'+esc(selectedTitle)+'</h1><div class="subtle">32 min<span class="dotsep">·</span>Camille, vous<span class="dotsep">·</span>'+ (speaker==='Speaker 3'?'1 voix à nommer':esc(speaker)) +'</div><div class="player"><button class="play" data-action="play" aria-label="'+(playing?'Mettre en pause':'Simuler la lecture')+'">'+(playing?'Ⅱ':'▶')+'</button>'+wave()+'<span class="time">00:38 / 32:14</span></div><div class="tabs">'+(dir==='carnet'?['notes','summary','transcript']:dir==='studio'?['transcript','notes','summary']:['summary','notes','transcript']).map(t=>'<button data-tab="'+t+'" class="'+(tab===t?'active':'')+'" aria-pressed="'+(tab===t)+'">'+({notes:'Notes',summary:'Synthèse',transcript:'Transcript'}[t])+'</button>').join('')+'</div><div id="artifact">'+(tab==='summary'?summary():tab==='transcript'?transcript():'<textarea class="editor" id="notes-editor" aria-label="Notes manuelles">'+esc(notes)+'</textarea><span class="saved">Modifications conservées pendant cette exploration.</span>')+'</div>';}
function menu(){return '<div class="mac-menubar"><span>Vendredi 23 oct.</span><span class="menuchip">hwyd ●</span><span>10:00</span></div><div style="max-width:340px;margin:23px auto;padding:0 20px"><div class="topline"><h2>'+(dir==='carnet'?'Une idée à garder ?':'Prêt à écouter.')+'</h2><span class="local">Local</span></div><p class="subtle" style="margin-top:10px">Réunion, appel ou pensée du moment.</p><button class="primary record" style="width:100%;margin:21px 0 8px" data-action="capture">Commencer une session</button><div style="text-align:center" class="small-caption">Raccourci personnalisable</div><div class="divider"></div><div class="overline">Dans 5 minutes</div><h3 style="margin:9px 0">Le prochain chapitre</h3><p class="subtle">Google Meet · Camille et Léa</p><button class="ghost" style="width:100%;margin-top:12px" data-action="join">Rejoindre et enregistrer</button><div class="divider"></div><button class="navitem" data-action="library">Ouvrir les sessions <span style="float:right">↗</span></button><button class="navitem" data-action="settings">Sources audio <span style="float:right">⌄</span></button><div id="settings-slot"></div><p class="footnote">Aucun enregistrement sans votre action.</p></div>';}
function render(){app.className='window '+dir;app.innerHTML=chrome()+(scene==='menu'?menu():'<div class="shell">'+sidebar()+'<main class="main">'+({library,capture,review}[scene])()+'</main></div>');root.querySelectorAll('[data-dir]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dir===dir));root.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===scene));document.getElementById('direction-desc').textContent=descriptions[dir];document.getElementById('recommend').textContent=dir==='studio'?'Direction retenue': 'Alternative explorée';}
function status(s){document.getElementById('prototype-status').textContent=s;}
root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.dir){dir=b.dataset.dir;tab=dir==='carnet'?'notes':dir==='studio'?'transcript':'summary';render();status('Piste '+({clair:'Clair',carnet:'Carnet',studio:'Studio'}[dir])+'.');return;}if(b.dataset.scene){scene=b.dataset.scene;render();status(scene==='capture'?'Capture simulée. Vous pouvez écrire dans le notepad.':'Les contrôles sont interactifs.');return;}if(b.dataset.open){selectedTitle=b.dataset.open;scene='review';render();return;}if(b.dataset.tab){tab=b.dataset.tab;render();return;}let a=b.dataset.action;if(['library','capture','review'].includes(a)){scene=a;render();return;}if(a==='stop'){selectedTitle='Conversation du vendredi';scene='review';tab='notes';notes=captureNotes;render();status('Fin de capture simulée. Les notes ont suivi la session.');}if(a==='timestamp'){captureNotes+='\n[00:18:42] ';document.getElementById('capture-editor').value=captureNotes;document.getElementById('capture-editor').focus();}if(a==='play'){playing=!playing;render();status(playing?'Lecture simulée, aucun fichier audio chargé.':'Lecture simulée en pause.');}if(a==='join'){scene='capture';render();status('Parcours simulé : aucun lien externe ouvert.');}if(a==='settings'){document.getElementById('settings-slot').innerHTML='<div class="sheet"><label for="micro">Microphone</label><select id="micro"><option>Micro du Mac</option><option>Micro de conférence</option></select><p class="subtle" style="margin-top:9px">Audio système inclus</p></div>';}});
root.addEventListener('input',e=>{if(e.target.id==='notes-editor')notes=e.target.value;if(e.target.id==='capture-editor'){captureNotes=e.target.value;document.getElementById('save-status').textContent='Note modifiée dans la maquette';}});
root.addEventListener('change',e=>{if(e.target.id==='speaker-select'){speaker=e.target.value;render();status(speaker==='Speaker 3'?'Voix laissée anonyme.':'Correction simulée : les segments de cette voix sont attribués à '+speaker+'.');}});
render();
// Contrôle structurel local : tous les parcours sont rendus puis l’état initial restauré.
for(const d of ['clair','carnet','studio'])for(const s of ['library','capture','review','menu']){dir=d;scene=s;render();if(!app.textContent.trim())throw Error('Vue vide');}
dir='studio';scene='library';tab='transcript';render();console.log('HWYD: 12 vues rendues, bibliothèque initiale prête.');
})();
</script></body></html>
