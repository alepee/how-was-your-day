name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Each push to a PR replaces its previous run. On main every run completes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Which parts a change touches, so each job runs only when it can catch something.
  # A PR is compared with its base, a push to main with the previous commit.
  # A manual run (workflow_dispatch) runs everything. Changing this file runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' }}
      realtime: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.realtime == 'true' }}
      app: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
      scripts: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.scripts == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            core:
              - 'Packages/HWYDCore/**'
              - 'scripts/test-summary.py'
              - '.github/workflows/ci.yml'
            realtime:
              - 'Sources/HWYDRealtime/**'
              - 'Tests/HWYDRealtimeTests/**'
              - 'scripts/test-realtime.sh'
              - '.github/workflows/ci.yml'
            app:
              - 'Sources/**'
              - 'Tests/**'
              - 'Resources/**'
              - 'Package.swift'
              - 'Package.resolved'
              - 'Packages/HWYDCore/Sources/**'
              - 'Packages/HWYDCore/Package.swift'
              - 'Packages/HWYDCore/Package.resolved'
              - 'scripts/build-app.sh'
              - 'scripts/test-mcp.py'
              - 'scripts/l10n.py'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/*.py'
              - '.github/workflows/ci.yml'

  # HWYDCore unit tests and the summary HTTP contract (a loopback stub stands in for the LLM).
  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Core tests
        run: swift test --package-path Packages/HWYDCore
      - name: Summary HTTP contract
        run: python3 scripts/test-summary.py

  # Plain C under address and undefined-behavior sanitizers: no Swift build, a few seconds.
  realtime:
    needs: changes
    if: needs.changes.outputs.realtime == 'true'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Realtime buffer sanitizers
        run: scripts/test-realtime.sh

  # Pipeline tests, localization catalog (it compiles every target), isolated app
  # build and synthetic checks (no microphone).
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Pipeline tests
        run: swift test
      - name: Localization catalog
        run: python3 scripts/l10n.py check
      - name: Build isolated app
        env:
          SIGN_IDENTITY: '-'
          HWYD_ALLOW_ADHOC: '1'
        run: scripts/build-app.sh release
      - name: Synthetic app checks
        run: |
          'build/How Was Your Day.app/Contents/MacOS/HWYD' --self-test build/ci-audio-test
          'build/How Was Your Day.app/Contents/MacOS/HWYD' --ui-test build/ci-ui-test
          'build/How Was Your Day.app/Contents/MacOS/HWYD' --ui-test build/ci-ui-test-en -AppleLanguages '(en)'
          python3 scripts/test-mcp.py 'build/How Was Your Day.app/Contents/Helpers/hwyd-mcp' build/ci-ui-test
          codesign --verify --deep --strict 'build/How Was Your Day.app'
          ! /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' 'build/How Was Your Day.app/Contents/Info.plist' 2>/dev/null
      - name: Package CI artifact (not a release)
        run: ditto -c -k --keepParent 'build/How Was Your Day.app' build/HowWasYourDay-ci.zip
      - uses: actions/upload-artifact@v7
        with:
          name: HowWasYourDay-ci-arm64
          path: build/HowWasYourDay-ci.zip
          retention-days: 7

  # Python contract tests that need neither Swift nor macOS.
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Python contract tests
        run: |
          mkdir -p build
          python3 scripts/test-appcast.py
          python3 scripts/test-act-probe.py
          python3 scripts/test-ledger-summary.py
          python3 scripts/test-benchmark-summary.py

  # The only required status check (main ruleset). It passes when every job
  # passed or was skipped. Add any new blocking job to its `needs`.
  ci:
    runs-on: ubuntu-latest
    needs: [changes, core, realtime, app, scripts]
    if: always()
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.changes.result == "success" and ([.[].result] | all(. == "success" or . == "skipped"))' >/dev/null
